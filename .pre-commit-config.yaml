# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=120']
        files: ^(myPortfolioManagement|tests)/

  # Import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=120']
        files: ^(myPortfolioManagement|tests)/

  # Linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--max-complexity=15', '--extend-ignore=E203,W503']
        files: ^(myPortfolioManagement|tests)/
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear

  # Security scanning with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ['-ll', '-x', 'tests/']
        files: ^myPortfolioManagement/

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Trailing whitespace
      - id: trailing-whitespace
        files: ^(myPortfolioManagement|tests)/

      # End of file fixer
      - id: end-of-file-fixer
        files: ^(myPortfolioManagement|tests)/

      # Check yaml files
      - id: check-yaml

      # Check json files
      - id: check-json
        exclude: \.ipynb$

      # Check for large files
      - id: check-added-large-files
        args: ['--maxkb=1000']

      # Check for merge conflicts
      - id: check-merge-conflict

      # Check for debug statements
      - id: debug-statements
        files: ^myPortfolioManagement/

      # Detect private keys
      - id: detect-private-key

      # Check for broken symlinks
      - id: check-symlinks

      # Mixed line endings
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Jupyter notebook cleaning
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: \.ipynb$

  # Check docstring formatting
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ['--convention=google', '--add-ignore=D100,D104,D107']
        files: ^myPortfolioManagement/
        exclude: __init__\.py$

# CI configuration
ci:
  autofix_prs: true
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
