[pytest]
# Pytest configuration for myPortfolioManagement

# Minimum pytest version
minversion = 7.0

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Custom markers
markers =
    unit: Standard unit test (fast, no external dependencies)
    integration: Multi-module integration test
    gpu: Test requires GPU (CuPy) - skipped if GPU unavailable
    slow: Long-running test (>5 seconds)
    data_fetch: Test requires internet/API access
    parametrize: Parametrized test

# Timeout for each test (in seconds)
timeout = 300

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning:pandas.*
    ignore::RuntimeWarning:numpy.*

# Coverage configuration (when using pytest-cov)
# Run with: pytest --cov=myPortfolioManagement --cov-report=html

# Console output options
console_output_style = progress

# Parallel execution (when using pytest-xdist)
# Run with: pytest -n auto

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
