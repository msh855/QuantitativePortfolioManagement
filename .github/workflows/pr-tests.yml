# Pull Request Testing Workflow
# Fast validation tests that run on every pull request (5-10 min)

name: PR Tests

on:
  pull_request:
    branches: [Master, main, develop]
    paths:
      - 'myPortfolioManagement/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/pr-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick syntax and import validation
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Check code formatting (Black)
        run: black --check --diff myPortfolioManagement tests
        continue-on-error: true

      - name: Check import sorting (isort)
        run: isort --check-only --diff myPortfolioManagement tests
        continue-on-error: true

      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 myPortfolioManagement tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning for other issues
          flake8 myPortfolioManagement tests --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  # Fast unit tests (no data fetching, no GPU, no slow tests)
  fast-tests:
    name: Fast Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install -e .

      - name: Run fast unit tests
        run: |
          pytest tests/ \
            -m "unit and not slow and not data_fetch and not gpu" \
            -v \
            --tb=short \
            -x \
            --timeout=60 \
            -q

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fast-test-results
          path: .pytest_cache/

  # Quick security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scan
        run: bandit -r myPortfolioManagement -ll -x tests
        continue-on-error: true

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check --full-report
        continue-on-error: true

  # Summary status check
  pr-ready:
    name: PR Ready
    runs-on: ubuntu-latest
    needs: [lint, fast-tests, security-scan]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.fast-tests.result }}" == "failure" ]]; then
            echo "PR checks failed!"
            exit 1
          fi
          echo "All PR checks passed!"
