# Main Branch Testing Workflow
# Comprehensive testing that runs on push to main/master (20-40 min)

name: Main Tests

on:
  push:
    branches: [Master, main]
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: 'Run slow tests'
        required: false
        default: 'true'
        type: boolean
      run_data_fetch_tests:
        description: 'Run data fetching tests'
        required: false
        default: 'true'
        type: boolean

jobs:
  # Full lint and quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy bandit

      - name: Format check (Black)
        run: black --check myPortfolioManagement tests
        continue-on-error: true

      - name: Import check (isort)
        run: isort --check-only myPortfolioManagement tests
        continue-on-error: true

      - name: Lint (flake8)
        run: flake8 myPortfolioManagement tests --max-line-length=120 --max-complexity=15
        continue-on-error: true

      - name: Security scan (Bandit)
        run: bandit -r myPortfolioManagement -ll
        continue-on-error: true

  # Unit tests across Python versions
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest tests/ \
            -m "unit and not slow and not data_fetch and not gpu" \
            -v \
            --tb=short \
            --cov=myPortfolioManagement \
            --cov-report=xml \
            --cov-report=term-missing \
            --timeout=120

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests-py${{ matrix.python-version }}
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: false

  # Slow tests (optional, only on main)
  slow-tests:
    name: Slow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests
    if: github.event.inputs.run_slow_tests != 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install -e .

      - name: Run slow tests
        run: |
          pytest tests/ \
            -m "slow and not gpu and not data_fetch" \
            -v \
            --tb=short \
            --timeout=300

  # Data fetching tests (require internet)
  data-fetch-tests:
    name: Data Fetching Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests
    if: github.event.inputs.run_data_fetch_tests != 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install -e .

      - name: Run data fetching tests
        run: |
          pytest tests/ \
            -m "data_fetch and not gpu" \
            -v \
            --tb=short \
            --timeout=180
        continue-on-error: true  # API may be unavailable

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install -e .

      - name: Run integration tests
        run: |
          pytest tests/ \
            -m "integration" \
            -v \
            --tb=short \
            --timeout=180

  # Full coverage report
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install -e .

      - name: Run full test suite with coverage
        run: |
          pytest tests/ \
            -m "not gpu and not data_fetch" \
            -v \
            --cov=myPortfolioManagement \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=50 \
            --timeout=300

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  # Final status
  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, coverage-report]
    if: always()

    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.coverage-report.result }}" == "failure" ]]; then
            echo "Some tests failed!"
            exit 1
          fi
          echo "All tests passed!"
